<svg xmlns="http://www.w3.org/2000/svg" width="420" height="500" viewBox="0 0 420 500" role="img" aria-labelledby="title description">
  <title id="title">Volcano Telephone Booths audio system</title>
  <desc id="description">A contact microphone attached to a tin can feeds a Focusrite audio interface. The Focusrite exchanges audio with a ThinkPad X270 running Discord, and its output feeds a soundbar inside the telephone booth.</desc>
  <rect width="420" height="500" fill="#161310"/>
  <text x="32" y="44" font-family="Space Mono, Liberation Mono, monospace" font-size="10" letter-spacing="1.2" fill="#8b8177">VOLCANO TELEPHONE BOOTHS / SIGNAL PATH</text>

  <g fill="#0f0d0b" stroke="#a6896a" stroke-width="1.4">
    <rect x="32" y="105" width="155" height="76"/>
    <rect x="230" y="105" width="158" height="76"/>
    <rect x="120" y="225" width="180" height="88"/>
    <rect x="120" y="380" width="180" height="68"/>
  </g>

  <g fill="none" stroke="#a6896a" stroke-width="2">
    <path d="M109 191L172 215"/>
    <path d="M309 191L250 215"/>
    <path d="M210 324V369"/>
  </g>
  <g fill="#a6896a">
    <path d="M172 215L163 211L166 202Z"/>
    <path d="M309 191L300 193L305 201Z"/>
    <path d="M250 215L253 205L262 210Z"/>
    <path d="M210 369L205 360L215 360Z"/>
  </g>
  <g font-family="Space Mono, Liberation Mono, monospace" font-size="10" letter-spacing=".8" fill="#a6896a">
    <text x="118" y="207">INPUT</text>
    <text x="271" y="207">AUDIO I/O</text>
    <text x="223" y="351">OUTPUT</text>
  </g>

  <g font-family="Space Mono, Liberation Mono, monospace" font-size="16" letter-spacing=".5" text-anchor="middle" fill="#d8d0c3">
    <text x="109.5" y="136">TIN CAN +</text>
    <text x="109.5" y="160">CONTACT MIC</text>
    <text x="309" y="136">THINKPAD X270</text>
    <text x="309" y="160">DISCORD</text>
    <text x="210" y="260">FOCUSRITE</text>
    <text x="210" y="285">AUDIO INTERFACE</text>
    <text x="210" y="408">SOUNDBAR</text>
    <text x="210" y="432">TELEPHONE BOOTH</text>
  </g>
</svg>
